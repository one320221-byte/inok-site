<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>INOK — добавить подписку</title>
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<style>
  /* страница-переходник: Telegram не открывает happ:// и подобные ссылки из кнопок, а браузер открывает */
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #E6E3DC;
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; width: 100%; text-align: center; }
  svg { width: 72px; height: 72px; }
  h1 { font-size: 24px; margin: 18px 0 8px; font-weight: 600; }
  p { color: #BDB8AE; margin: 0 0 22px; }
  a.btn, button { display: block; width: 100%; box-sizing: border-box; padding: 15px 18px; margin: 0 0 12px; border-radius: 12px;
                  font: 600 17px system-ui, sans-serif; text-decoration: none; cursor: pointer; border: 0; }
  a.btn { background: #F0B44C; color: #000; }
  button { background: transparent; color: #E6E3DC; border: 1px solid #3a3833; }
  small { display: block; color: #7d786f; margin-top: 18px; }
  small a { color: #BDB8AE; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 32 32" aria-hidden="true">
    <path d="M16 1.5C13 3.5 7.5 8 6.5 16 6 20 5 25 3 30.5H29C27 25 26 20 25.5 16 24.5 8 19 3.5 16 1.5Z" fill="#E6E3DC"/>
    <path d="M16 8.5C12.6 10.5 11 14.5 11 19 11 22 11.6 24.5 12.5 26.5H19.5C20.4 24.5 21 22 21 19 21 14.5 19.4 10.5 16 8.5Z" fill="#000"/>
    <path d="M16 13.2C17.7 15.8 19 17.6 19 19.8 19 21.6 17.7 23 16 23S13 21.6 13 19.8C13 17.6 14.3 15.8 16 13.2Z" fill="#F0B44C"/>
  </svg>
  <h1 id="title">Открываем приложение…</h1>
  <p id="lead">Если ничего не произошло, нажмите кнопку ниже. Приложение должно быть уже установлено.</p>
  <a class="btn" id="open" href="#">Открыть в приложении</a>
  <button type="button" id="copy">Скопировать ссылку</button>
  <small>Приложения ещё нет? Вернитесь в <a href="https://t.me/inokvpn_bot?start=apps">бота</a>, раздел «Как подключить».</small>
</main>
<script>
  // ссылка-подписка лежит после # и не уходит на сервер; ?app= говорит, какое приложение открыть
  const SCHEMES = { happ: "happ://add/", v2raytun: "v2raytun://import/", hiddify: "hiddify://import/" };
  const NAMES = { happ: "Happ", v2raytun: "v2RayTun", hiddify: "Hiddify" };
  const app = new URLSearchParams(location.search).get("app");
  const sub = decodeURIComponent(location.hash.slice(1));
  const ok = SCHEMES[app] && /^https:\/\//.test(sub);
  const $ = (id) => document.getElementById(id);
  if (!ok) {
    $("title").textContent = "Ссылка неполная";
    $("lead").textContent = "Откройте «Мой доступ» в боте INOK и нажмите кнопку приложения ещё раз.";
    $("open").href = "https://t.me/inokvpn_bot?start=key";
    $("open").textContent = "Вернуться в бота";
    $("copy").hidden = true;
  } else {
    const deeplink = SCHEMES[app] + sub;
    $("title").textContent = "Открываем " + NAMES[app] + "…";
    $("open").href = deeplink;
    $("open").textContent = "Открыть в " + NAMES[app];
    $("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(sub); $("copy").textContent = "Скопировано"; }
      catch { prompt("Скопируйте ссылку:", sub); }
    });
    setTimeout(() => { location.href = deeplink; }, 300);
  }
</script>
</body>
</html>
